<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFS Inquiry Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
  // Branded favicon (stopwatch on navy/brown) so the tab and any bookmark match the app colours
  (function(){
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>" +
      "<rect width='64' height='64' rx='14' fill='rgb(12,33,64)'/>" +
      "<path d='M0 16 V14 A14 14 0 0 1 14 0 H50 A14 14 0 0 1 64 14 V16 Z' fill='rgb(138,90,53)'/>" +
      "<circle cx='32' cy='38' r='17' fill='none' stroke='rgb(232,217,189)' stroke-width='4'/>" +
      "<line x1='32' y1='38' x2='32' y2='26' stroke='rgb(232,217,189)' stroke-width='3' stroke-linecap='round'/>" +
      "<line x1='32' y1='38' x2='39' y2='42' stroke='rgb(232,217,189)' stroke-width='3' stroke-linecap='round'/>" +
      "<circle cx='32' cy='38' r='2.4' fill='rgb(232,217,189)'/>" +
      "<rect x='27' y='6' width='10' height='5' rx='2' fill='rgb(232,217,189)'/>" +
      "</svg>";
    var href = "data:image/svg+xml," + encodeURIComponent(svg);
    var link = document.createElement("link");
    link.rel = "icon"; link.type = "image/svg+xml"; link.href = href;
    document.head.appendChild(link);
    var touch = document.createElement("link");
    touch.rel = "apple-touch-icon"; touch.href = href;
    document.head.appendChild(touch);
  })();
</script>
<style>
  :root{
    --navy-dark:#0c2140;
    --navy:#123255;
    --navy-light:#1d4568;
    --navy-hover:#254f78;
    --brown-1:#8a5a35;
    --brown-2:#6b4423;
    --gold:#d3b788;
    --gold-soft:#e8d9bd;
    --bg:#eef1f5;
    --card:#ffffff;
    --line:#e2e6ec;
    --text:#1a2333;
    --text-muted:#66748a;
    --green:#2e7d5b;
    --green-bg:#e5f3ec;
    --amber:#a9720b;
    --amber-bg:#fbf0dc;
    --red:#c0392b;
    --red-bg:#fce8e6;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width:250px;
    flex-shrink:0;
    background:linear-gradient(180deg,var(--navy-dark),var(--navy));
    color:#fff;
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0; left:0; bottom:0;
    z-index:40;
    transition:transform .25s ease;
  }
  #sidebar .brand{
    padding:22px 20px 18px;
    border-bottom:1px solid rgba(255,255,255,.08);
    display:flex; align-items:center; gap:10px;
  }
  #sidebar .brand .logo{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(135deg,var(--brown-1),var(--brown-2));
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;color:var(--gold-soft);
    flex-shrink:0;
  }
  #sidebar .brand div h1{margin:0;font-size:15.5px;letter-spacing:.2px;color:var(--gold-soft);font-family:Georgia,'Times New Roman',serif;}
  #sidebar .brand div p{margin:1px 0 0;font-size:11px;color:rgba(255,255,255,.55);}
  #sidebar nav{padding:14px 12px;flex:1;overflow-y:auto;}
  .nav-section-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
    color:rgba(255,255,255,.4);margin:14px 10px 6px;
  }
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:10px 12px;border-radius:8px;
    color:rgba(255,255,255,.82);
    cursor:pointer;font-size:13.5px;font-weight:500;
    margin-bottom:3px;user-select:none;
    border:1px solid transparent;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--navy-light);color:#fff;border-color:rgba(255,255,255,.08);}
  .nav-item .ic{width:18px;text-align:center;flex-shrink:0;opacity:.9;}
  .nav-item .badge{
    margin-left:auto;background:var(--brown-1);color:#fff;
    font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;
  }
  .nav-item .chev{margin-left:auto;font-size:11px;transition:transform .2s;opacity:.7;}
  .nav-item.open .chev{transform:rotate(180deg);}
  .dropdown-menu{display:none;flex-direction:column;padding:2px 0 8px 10px;gap:2px;}
  .dropdown-menu.open{display:flex;}
  .dropdown-item{
    display:flex;align-items:center;gap:8px;
    padding:8px 10px;border-radius:7px;font-size:12.5px;
    color:rgba(255,255,255,.72);cursor:pointer;
  }
  .dropdown-item:hover{background:rgba(255,255,255,.08);color:#fff;}
  #sidebar .footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:rgba(255,255,255,.4);}

  /* ---------- Main ---------- */
  #main{margin-left:250px;flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;}
  header.topbar{
    background:linear-gradient(120deg,var(--brown-1),var(--brown-2) 75%);
    color:#fff;
    padding:20px 28px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;
  }
  header.topbar .titles h2{margin:0;font-family:Georgia,'Times New Roman',serif;font-size:22px;color:var(--gold-soft);letter-spacing:.2px;}
  header.topbar .titles p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.75);}
  header.topbar .actions{display:flex;gap:10px;align-items:center;}
  #menu-toggle{display:none;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:8px;font-size:16px;cursor:pointer;}

  .btn{
    border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:filter .15s, transform .05s;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--gold-soft);color:var(--brown-2);}
  .btn-primary:hover{filter:brightness(0.95);}
  .btn-ghost{background:rgba(255,255,255,.14);color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,.22);}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--text);}
  .btn-outline:hover{background:#f6f7f9;}
  .btn-outline.on-brown{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);}
  .btn-outline.on-brown:hover{background:rgba(255,255,255,.22);}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:7px;}
  .btn-danger-text{background:none;color:var(--red);padding:6px 8px;}
  .btn-edit-text{background:none;color:var(--navy);padding:6px 8px;}

  #content{padding:24px 28px 60px;flex:1;}

  /* ---------- Dashboard ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px;margin-bottom:22px;}
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 16px 14px;position:relative;overflow:hidden;
  }
  .stat-card .num{font-size:24px;font-weight:800;color:var(--navy-dark);line-height:1.1;}
  .stat-card .lbl{margin-top:6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:600;}
  .stat-card .accent{position:absolute;top:0;left:0;width:4px;height:100%;}
  .stat-card.total .accent{background:var(--navy);}
  .stat-card.open .accent{background:#2e6fa7;}
  .stat-card.pending .accent{background:var(--amber);}
  .stat-card.overdue .accent{background:var(--red);}
  .stat-card.escalated .accent{background:#8e44ad;}
  .stat-card.closed .accent{background:var(--green);}
  .stat-card.tat .accent{background:var(--brown-1);}

  .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .panel h3{margin:0 0 14px;font-size:14.5px;color:var(--navy-dark);font-family:Georgia,serif;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;}
  .bar-row .name{width:150px;flex-shrink:0;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar-track{flex:1;background:#eef1f5;border-radius:6px;height:9px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--brown-1),var(--gold));border-radius:6px;}
  .bar-count{width:28px;text-align:right;font-weight:700;color:var(--navy-dark);flex-shrink:0;}

  .tat-table{width:100%;font-size:12.5px;border-collapse:collapse;}
  .tat-table th{text-align:left;padding:6px 4px;color:var(--text-muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
  .tat-table td{padding:7px 4px;border-top:1px solid var(--line);}
  .tat-table td.num{text-align:right;}
  .tat-table td.avg{text-align:right;font-weight:700;color:var(--navy-dark);}

  /* ---------- Filters ---------- */
  .filter-bar{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;
  }
  .filter-field{display:flex;flex-direction:column;gap:4px;min-width:150px;}
  .filter-field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700;}
  select, input[type=text], input[type=date], input[type=time], input[type=tel], input[type=email], textarea{
    border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:13px;
    font-family:inherit;color:var(--text);background:#fff;
  }
  select:focus, input:focus, textarea:focus{outline:2px solid var(--navy-light);outline-offset:1px;}
  .search-wrap{flex:1;min-width:200px;}
  .filter-actions{margin-left:auto;display:flex;gap:8px;}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1500px;}
  thead th{
    background:#f6f8fa;color:var(--text-muted);text-transform:uppercase;font-size:10px;letter-spacing:.05em;
    padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;
  }
  thead th:hover{color:var(--navy-dark);}
  thead th .sort-arrow{margin-left:4px;opacity:.4;font-size:10px;}
  thead th.active-sort .sort-arrow{opacity:1;color:var(--brown-1);}
  tbody td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
  tbody tr:hover{background:#fbf9f5;}
  tbody tr:last-child td{border-bottom:none;}
  .id-cell{font-weight:700;color:var(--navy-dark);}
  .sub{display:block;font-size:11px;color:var(--text-muted);margin-top:1px;}
  .ref-cell{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
  .pill-New, .pill-Open{background:#e6f0fa;color:#2e6fa7;}
  .pill-Assigned, .pill-InProgress{background:#eef0fb;color:#4b53c9;}
  .pill-Waiting{background:var(--amber-bg);color:var(--amber);}
  .pill-Escalated{background:#f3e6fb;color:#8e44ad;}
  .pill-Resolved, .pill-Closed{background:var(--green-bg);color:var(--green);}
  .pill-Pending{background:var(--amber-bg);color:var(--amber);}
  .pill-Cancelled{background:#f0f1f3;color:#7a8291;}

  .prio-Critical{color:var(--red);font-weight:800;}
  .prio-High{color:#c0392b;font-weight:700;}
  .prio-Medium{color:var(--amber);font-weight:700;}
  .prio-Low{color:var(--text-muted);font-weight:600;}

  .sla-On{color:var(--green);font-weight:700;}
  .sla-Due{color:var(--amber);font-weight:700;}
  .sla-Overdue{color:var(--red);font-weight:700;}

  .tat-ongoing{color:var(--amber);font-weight:700;}
  .tat-done{color:var(--navy-dark);font-weight:700;}

  .row-actions{display:flex;gap:4px;justify-content:flex-end;}

  .empty-state{padding:60px 20px;text-align:center;color:var(--text-muted);}
  .empty-state .big{font-size:34px;margin-bottom:8px;}
  .empty-state h4{margin:0 0 6px;color:var(--navy-dark);font-family:Georgia,serif;}

  .table-footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--line);flex-wrap:wrap;gap:6px;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(12,33,64,.55);
    display:flex;align-items:flex-start;justify-content:center;
    padding:34px 16px;z-index:100;overflow-y:auto;
  }
  .modal{
    background:#fff;border-radius:14px;max-width:760px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    padding:18px 24px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    background:linear-gradient(120deg,var(--brown-1),var(--brown-2));
    border-radius:14px 14px 0 0;color:#fff;
  }
  .modal-head h3{margin:0;font-family:Georgia,serif;font-size:18px;color:var(--gold-soft);}
  .modal-head button{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:15px;}
  .modal-body{padding:20px 24px;max-height:65vh;overflow-y:auto;}
  .form-section{margin-bottom:20px;}
  .form-section h4{
    margin:0 0 12px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--brown-1);border-bottom:2px solid var(--gold-soft);padding-bottom:6px;font-weight:800;
  }
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .form-field{display:flex;flex-direction:column;gap:4px;}
  .form-field.span-2{grid-column:span 2;}
  .form-field label{font-size:11.5px;font-weight:700;color:var(--text-muted);}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
  .hint{font-size:11px;color:var(--text-muted);font-weight:400;}

  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--navy-dark);color:#fff;
    padding:12px 18px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    z-index:200;display:flex;align-items:center;gap:8px;
  }

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#c9d0da;border-radius:6px;}

  @media (max-width:980px){
    .stat-grid{grid-template-columns:repeat(3,1fr);}
    .panel-grid{grid-template-columns:1fr;}
    .form-grid, .form-grid.cols-3{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:720px){
    #sidebar{transform:translateX(-100%);width:230px;}
    #sidebar.open{transform:translateX(0);}
    #main{margin-left:0;}
    #menu-toggle{display:inline-flex;align-items:center;justify-content:center;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .form-grid, .form-grid.cols-3{grid-template-columns:1fr;}
    .form-field.span-2{grid-column:span 1;}
  }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <div class="logo">CFS</div>
    <div>
      <h1>CFS Inquiry Tracker</h1>
      <p>Container Freight Station</p>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="footer">Data stored in your browser session</div>
</aside>

<div id="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button id="menu-toggle" aria-label="Toggle menu">☰</button>
      <div class="titles">
        <h2 id="page-title">Dashboard</h2>
        <p id="page-sub">Real-time visibility into all inquiries</p>
      </div>
    </div>
    <div class="actions" id="topbar-actions"></div>
  </header>

  <main id="content"></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============================================================
   DATA MODEL & CONSTANTS
============================================================ */
const CHANNELS = ["Email","Phone Call","Walk-in","WhatsApp","SMS","Customer Portal","Agent","Shipping Line","KRA/Customs","Other"];
const CATEGORIES = {
  "Commercial": ["Storage Rates","Handling Charges","Transport Charges","Port Charges","Quotation Request","Discount Request","Waiver Request","Credit Terms","Billing Inquiry","Invoice Request","Payment Confirmation","Refund Request"],
  "Cargo Status": ["Cargo Arrival","Cargo Availability","Cargo Release","Cargo Collection","Container Arrival","Container Transfer Status","Container Location","Delivery Status","Customs Clearance Status","Gate Pass Status","Examination Status","Stuffing","Destuffing","Empty Return"],
  "Documentation": ["Delivery Order","Release Letter","Invoice","Receipt","Manifest","Bill of Lading (BL)","House BL","Master BL","Customs Documents","Import Entry","Export Documentation","Missing Documents","Document Amendment"],
  "Operational": ["Container Delay","Truck Delay","Congestion","Port Delay","Customs Delay","Scanner Delay","Equipment Availability","Crane Availability","Chassis Availability","Truck Booking","Cargo Damage","Cargo Shortage","Cargo Overlanded","Cargo Misplacement","Seal Verification","Container Inspection"],
  "Customer Service": ["General Inquiry","Complaint","Compliment","Suggestion","Escalation","Follow-up","Feedback"],
  "Others": ["System Access","User Support","Appointment Booking","Site Visit","Compliance Inquiry","Safety Inquiry"]
};
const PRIORITIES = ["Critical","High","Medium","Low"];
const DEPARTMENTS = ["Operations","Customer Service","Finance","Commercial","Transport","Documentation","Yard","Management","Customs Liaison"];
const SLA_TARGETS = ["Immediate","30 Minutes","1 Hour","2 Hours","4 Hours","Same Day","24 Hours","48 Hours","72 Hours","Custom"];
const SLA_HOURS = {"Immediate":0.25,"30 Minutes":0.5,"1 Hour":1,"2 Hours":2,"4 Hours":4,"Same Day":10,"24 Hours":24,"48 Hours":48,"72 Hours":72,"Custom":48};
const STATUSES = ["New","Open","Assigned","In Progress","Waiting for Customer","Waiting for Shipping Line","Waiting for Customs","Waiting for Finance","Escalated","Pending","Resolved","Closed","Cancelled"];
const SATISFACTION = ["Very Satisfied","Satisfied","Neutral","Dissatisfied","Very Dissatisfied"];

let inquiries = [];
let filters = { search:"", status:"", priority:"", channel:"", category:"", department:"" };
let sortKey = "dateReceived", sortDir = "desc";
let currentPage = "dashboard";
let reportsMenuOpen = false;

function uid(){ return Math.random().toString(36).slice(2,9); }

function nextInquiryId(){
  const nums = inquiries.map(i => parseInt((i.inquiryId||"").replace(/\D/g,""))||0);
  const n = (nums.length ? Math.max(...nums) : 0) + 1;
  return "INQ-" + String(n).padStart(4,"0");
}

async function loadData(){
  try{
    const res = await window.storage.get("inquiries", false);
    inquiries = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ inquiries = []; }
  if(inquiries.length === 0){
    inquiries = seedData();
    await persist();
  }
  render();
}

async function persist(){
  try{
    await window.storage.set("inquiries", JSON.stringify(inquiries), false);
  }catch(e){
    console.error("Storage error", e);
    showToast("⚠ Could not save data");
  }
}

function seedData(){
  const today = new Date();
  const d = (offset) => { const dt = new Date(today); dt.setDate(dt.getDate()-offset); return dt.toISOString().slice(0,10); };
  return [
    {id:uid(), inquiryId:"INQ-0001", dateReceived:d(0), timeReceived:"09:15", channel:"Email", customerName:"John Mwangi", company:"Amber Freight Ltd", contactPerson:"John Mwangi", phone:"0712345678", email:"john@amberfreight.co.ke",
      category:"Cargo Status", subtype:"Cargo Release", referenceNumbers:"CONT: MSKU1234567, BL: MEDU998877", priority:"High",
      receivedBy:"Grace Wanjiru", department:"Operations", assignedStaff:"Peter Otieno", slaTarget:"4 Hours", status:"In Progress",
      escalationLevel:"", resolvedDate:"", resolvedTime:"", resolutionSummary:"", satisfaction:"", createdAt:Date.now()-3600000},
    {id:uid(), inquiryId:"INQ-0002", dateReceived:d(1), timeReceived:"11:40", channel:"WhatsApp", customerName:"Aisha Noor", company:"Coastal Traders", contactPerson:"Aisha Noor", phone:"0722334455", email:"aisha@coastaltraders.com",
      category:"Commercial", subtype:"Quotation Request", referenceNumbers:"", priority:"Medium",
      receivedBy:"Grace Wanjiru", department:"Commercial", assignedStaff:"Mary Achieng", slaTarget:"24 Hours", status:"Resolved",
      escalationLevel:"", resolvedDate:d(0), resolvedTime:"10:05", resolutionSummary:"Quotation sent via email.", satisfaction:"Satisfied", createdAt:Date.now()-90000000},
    {id:uid(), inquiryId:"INQ-0003", dateReceived:d(2), timeReceived:"14:05", channel:"Phone Call", customerName:"David Kimani", company:"Zenith Logistics", contactPerson:"David Kimani", phone:"0733445566", email:"david@zenithlog.co.ke",
      category:"Operational", subtype:"Container Delay", referenceNumbers:"CONT: TCLU4455667", priority:"Critical",
      receivedBy:"Samuel Kiptoo", department:"Yard", assignedStaff:"Samuel Kiptoo", slaTarget:"1 Hour", status:"Escalated",

/* ============================================================
   TIME / TAT HELPERS
============================================================ */
function formatDuration(ms){
  if(ms==null) return "—";
  if(ms<0) ms=0;
  const totalMin = Math.round(ms/60000);
  const days = Math.floor(totalMin/1440);
  const hours = Math.floor((totalMin%1440)/60);
  const mins = totalMin%60;
  let parts=[];
  if(days) parts.push(days+"d");
  if(hours) parts.push(hours+"h");
  if(mins || parts.length===0) parts.push(mins+"m");
  return parts.join(" ");
}

function tatInfo(inq){
  if(!inq.dateReceived || !inq.timeReceived) return {ms:null, label:"—", ongoing:false, resolved:false};
  const received = new Date(inq.dateReceived+"T"+inq.timeReceived);
  if(isNaN(received)) return {ms:null, label:"—", ongoing:false, resolved:false};
  if(inq.resolvedDate && inq.resolvedTime){
    const resolved = new Date(inq.resolvedDate+"T"+inq.resolvedTime);
    if(isNaN(resolved)) return {ms:null, label:"—", ongoing:false, resolved:false};
    const ms = Math.max(0, resolved-received);
    return {ms, label: formatDuration(ms), ongoing:false, resolved:true};
  }
  const ms = Math.max(0, Date.now()-received);
  return {ms, label: formatDuration(ms)+" (ongoing)", ongoing:true, resolved:false};
}

function slaInfo(inq){
  const t = tatInfo(inq);
  if(t.ms==null) return {label:"—", cls:"On"};
  const target = SLA_HOURS[inq.slaTarget] ?? 24;
  const targetMs = target*3600000;
  if(t.resolved){
    return t.ms>targetMs ? {label:"Resolved Late", cls:"Overdue"} : {label:"Resolved On Time", cls:"On"};
  }
  if(t.ms>targetMs) return {label:"Overdue", cls:"Overdue"};
  if(t.ms>targetMs*0.7) return {label:"Due Soon", cls:"Due"};
  return {label:"On Time", cls:"On"};
}

function statusPillClass(status){ return "pill-" + status.replace(/[^A-Za-z]/g,""); }

function showToast(msg){
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast">${msg}</div>`;
  setTimeout(()=>{ root.innerHTML=""; }, 2600);
}

function fmtDate(dstr){
  if(!dstr) return "—";
  const dt = new Date(dstr + "T00:00:00");
  if(isNaN(dt)) return dstr;
  return dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'});
}

function truncate(s,n){ return s && s.length>n ? s.slice(0,n-1)+"…" : (s||""); }
function escapeAttr(s){ return (s||"").replace(/"/g,"&quot;"); }
function dateStamp(){ return new Date().toISOString().slice(0,10); }

function countBy(arr, key){
  const map = {};
  arr.forEach(i => { const k = i[key] || "Unspecified"; map[k] = (map[k]||0)+1; });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function groupTAT(list, key){
  const map = {};
  list.forEach(i=>{
    if(!(i.resolvedDate && i.resolvedTime)) return;
    const k = i[key] || "Unspecified";
    if(!map[k]) map[k]=[];
    map[k].push(tatInfo(i).ms);
  });
  return Object.entries(map).map(([name,arr])=>({
    name, count:arr.length, avg:arr.reduce((a,b)=>a+b,0)/arr.length
  })).sort((a,b)=>b.avg-a.avg);
}

function renderDashboard(){
  const total = inquiries.length;
  const open = inquiries.filter(i=>!["Resolved","Closed","Cancelled"].includes(i.status)).length;
  const closed = inquiries.filter(i=>["Resolved","Closed"].includes(i.status)).length;
  const pending = inquiries.filter(i=>i.status==="Pending" || i.status.startsWith("Waiting")).length;
  const overdue = inquiries.filter(i=>slaInfo(i).cls==="Overdue").length;
  const escalated = inquiries.filter(i=>i.status==="Escalated").length;

  const resolvedList = inquiries.filter(i=>i.resolvedDate && i.resolvedTime);
  const avgMs = resolvedList.length ? resolvedList.reduce((s,i)=>s+tatInfo(i).ms,0)/resolvedList.length : null;

  const byChannel = countBy(inquiries, "channel");
  const byPriority = countBy(inquiries, "priority");
  const tatByPriority = groupTAT(inquiries, "priority");
  const tatByDept = groupTAT(inquiries, "department");

  return `
    <div class="stat-grid">
      ${statCard("total","Total Inquiries",total)}
      ${statCard("open","Open",open)}
      ${statCard("pending","Pending",pending)}
      ${statCard("overdue","Overdue",overdue)}
      ${statCard("escalated","Escalated",escalated)}
      ${statCard("closed","Closed",closed)}
      ${statCard("tat","Avg. Turnaround Time", avgMs!=null ? formatDuration(avgMs) : "—")}
    </div>
    <div class="panel-grid">
      <div class="panel">
        <h3>Average Turnaround Time by Priority</h3>
        ${renderTATTable(tatByPriority)}
      </div>
      <div class="panel">
        <h3>Average Turnaround Time by Department</h3>
        ${renderTATTable(tatByDept)}
      </div>
    </div>
    <div class="panel-grid">
      <div class="panel">
        <h3>Inquiries by Channel</h3>
        ${renderBars(byChannel, total)}
      </div>
      <div class="panel">
        <h3>Inquiries by Priority</h3>
        ${renderBars(byPriority, total)}
      </div>
    </div>
  `;
}

function statCard(cls,label,val){
  return `<div class="stat-card ${cls}"><div class="accent"></div><div class="num">${val}</div><div class="lbl">${label}</div></div>`;
}
function renderBars(pairs, total){
  if(pairs.length===0) return `<p style="color:var(--text-muted);font-size:13px;">No data yet.</p>`;
  const max = Math.max(...pairs.map(p=>p[1]),1);
  return pairs.map(([name,count])=>`
    <div class="bar-row">
      <div class="name">${name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(count/max*100).toFixed(0)}%"></div></div>
      <div class="bar-count">${count}</div>
    </div>
  `).join("");
}
function renderTATTable(rows){
  if(rows.length===0) return `<p style="color:var(--text-muted);font-size:13px;">No resolved inquiries yet.</p>`;
  return `<table class="tat-table">
    <thead><tr><th>Name</th><th class="num">Resolved</th><th class="num">Avg. TAT</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.name}</td><td class="num">${r.count}</td><td class="avg">${formatDuration(r.avg)}</td></tr>`).join("")}</tbody>
  </table>`;
}

function getFiltered(){
  let list = inquiries.slice();
  const f = filters;
  if(f.search){
    const s = f.search.toLowerCase();
    list = list.filter(i =>
      (i.inquiryId||"").toLowerCase().includes(s) ||
      (i.customerName||"").toLowerCase().includes(s) ||
      (i.company||"").toLowerCase().includes(s) ||
      (i.referenceNumbers||"").toLowerCase().includes(s) ||
      (i.subtype||"").toLowerCase().includes(s)
    );
  }
  if(f.status) list = list.filter(i=>i.status===f.status);
  if(f.priority) list = list.filter(i=>i.priority===f.priority);
  if(f.channel) list = list.filter(i=>i.channel===f.channel);
  if(f.category) list = list.filter(i=>i.category===f.category);
  if(f.department) list = list.filter(i=>i.department===f.department);

  list.sort((a,b)=>{
    if(sortKey==="tat"){
      const va = tatInfo(a).ms ?? -1, vb = tatInfo(b).ms ?? -1;
      return sortDir==="asc" ? va-vb : vb-va;
    }
    let va, vb;
    if(sortKey==="sla"){ va = slaInfo(a).label; vb = slaInfo(b).label; }
    else if(sortKey==="resolvedDate"){ va = (a.resolvedDate||"")+(a.resolvedTime||""); vb = (b.resolvedDate||"")+(b.resolvedTime||""); }
    else { va = a[sortKey] || ""; vb = b[sortKey] || ""; }
    if(sortKey==="dateReceived"){ va = va + (a.timeReceived||""); vb = vb + (b.timeReceived||""); }
    const cmp = String(va).localeCompare(String(vb));
    return sortDir==="asc" ? cmp : -cmp;
  });
  return list;
}

                <div class="form-field"><label>Assigned Staff</label><input type="text" name="assignedStaff" value="${escapeAttr(data.assignedStaff)}"></div>
              </div>
            </div>

            <div class="form-section">
              <h4>Status & Escalation</h4>
              <div class="form-grid">
                <div class="form-field"><label>Inquiry Status</label><select name="status">${selectOptions(STATUSES, data.status)}</select></div>
                <div class="form-field"><label>Escalation Level</label><select name="escalationLevel">${selectOptions(["","Level 1","Level 2","Level 3","Management"], data.escalationLevel)}</select></div>
              </div>
            </div>

            <div class="form-section">
              <h4>Resolution & Turnaround</h4>
              <div class="form-grid cols-3">
                <div class="form-field"><label>Date Resolved</label><input type="date" name="resolvedDate" id="resolved-date" value="${data.resolvedDate||''}"></div>
                <div class="form-field"><label>Time Resolved</label><input type="time" name="resolvedTime" id="resolved-time" value="${data.resolvedTime||''}"></div>
                <div class="form-field" style="justify-content:flex-end;">
                  <button type="button" class="btn btn-outline btn-sm" id="set-resolved-now">Set to now</button>
                </div>
              </div>
              <div class="form-field span-2" style="margin-top:12px;">
                <label>Resolution Summary</label>
                <textarea name="resolutionSummary" rows="3">${data.resolutionSummary||""}</textarea>
              </div>
              <div class="form-grid" style="margin-top:12px;">
                <div class="form-field"><label>Customer Satisfaction</label><select name="satisfaction">${selectOptions(["",...SATISFACTION], data.satisfaction)}</select></div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-foot">
          <button class="btn btn-outline" id="modal-cancel">Cancel</button>
          <button class="btn btn-primary" id="modal-save">${isEdit ? "Save Changes" : "Create Inquiry"}</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById("modal-close").onclick = closeModal;
  document.getElementById("modal-cancel").onclick = closeModal;
  document.getElementById("modal-overlay").addEventListener("click", (e)=>{ if(e.target.id==="modal-overlay") closeModal(); });

  document.getElementById("category-select").addEventListener("change", (e)=>{
    const subSel = document.getElementById("subtype-select");
    subSel.innerHTML = selectOptions(CATEGORIES[e.target.value] || [], "");
  });

  document.getElementById("set-resolved-now").addEventListener("click", ()=>{
    const now = new Date();
    document.getElementById("resolved-date").value = now.toISOString().slice(0,10);
    document.getElementById("resolved-time").value = now.toTimeString().slice(0,5);
  });

  document.getElementById("modal-save").onclick = ()=> saveInquiry(data.id, isEdit);
}

function selectOptions(items, selected){
  return items.map(i=>`<option value="${i}" ${i===selected?'selected':''}>${i || '—'}</option>`).join("");
}

function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }

function saveInquiry(id, isEdit){
  const form = document.getElementById("inquiry-form");
  const fd = new FormData(form);
  if(!fd.get("customerName") || !fd.get("customerName").trim()){
    showToast("⚠ Customer name is required");
    return;
  }
  const updated = {};
  for(const [k,v] of fd.entries()) updated[k] = v;

  if(isEdit){
    const idx = inquiries.findIndex(i=>i.id===id);
    inquiries[idx] = {...inquiries[idx], ...updated};
    showToast(`Saved changes to ${inquiries[idx].inquiryId}`);
  } else {
    const newInq = { id, inquiryId: nextInquiryId(), ...updated, createdAt: Date.now() };
    inquiries.push(newInq);
    showToast(`Created ${newInq.inquiryId}`);
  }
  persist();
  closeModal();
  render();
}

/* ============================================================
   PDF REPORTS (branded, downloaded — not printed)
============================================================ */
function newReportDoc(title, subtitle, orientation){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation: orientation||"landscape", unit:"pt", format:"a4"});
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFillColor(107,68,35);
  doc.rect(0,0,pageWidth,64,'F');
  doc.setFillColor(211,183,136);
  doc.rect(0,60,pageWidth,4,'F');
  doc.setTextColor(232,217,189);
  doc.setFont("helvetica","bold");
  doc.setFontSize(17);
  doc.text(title, 24, 30);
  doc.setFont("helvetica","normal");
  doc.setFontSize(9.5);
  doc.setTextColor(255,255,255);
  doc.text(subtitle, 24, 46);
  doc.setFontSize(8.5);
  doc.text("CFS Inquiry Tracker", pageWidth-24, 46, {align:"right"});
  return {doc, startY:88, pageWidth};
}

function finalizeAndSave(doc, filename){
  const pageCount = doc.internal.getNumberOfPages();
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  for(let p=1;p<=pageCount;p++){
    doc.setPage(p);
    doc.setFontSize(8);
    doc.setTextColor(140);
    doc.setFont("helvetica","normal");
    doc.text("Generated " + new Date().toLocaleString(), 24, pageHeight-16);
    doc.text("Page "+p+" of "+pageCount, pageWidth-24, pageHeight-16, {align:"right"});
  }
  doc.save(filename);
  showToast("📥 Report downloaded");
}

function addSection(doc, title, head, body, startY){
  const pageHeight = doc.internal.pageSize.getHeight();
  if(startY > pageHeight - 130){ doc.addPage(); startY = 40; }
  doc.setFontSize(11);
  doc.setTextColor(12,33,64);
  doc.setFont("helvetica","bold");
  doc.text(title, 24, startY);
  doc.autoTable({
    head:[head], body, startY: startY+8, theme:"grid",
    headStyles:{fillColor:[18,50,85], textColor:[232,217,189], fontStyle:"bold", fontSize:9},
    bodyStyles:{fontSize:8.5, textColor:[26,35,51]},
    alternateRowStyles:{fillColor:[238,241,245]},
    margin:{left:24,right:24},
  });
  return doc.lastAutoTable.finalY + 26;
}

function generateReport(type){
  if(inquiries.length===0){ showToast("No inquiries to report on yet"); return; }
  reportsMenuOpen = false;
  renderNav();
  if(type==="full-list") return reportFullList(inquiries, "Full Inquiry List Report", "full-inquiry-list");
  if(type==="turnaround") return reportTurnaround();
  if(type==="sla") return reportSLA();
  if(type==="overdue") return reportOverdue();
  if(type==="status-summary") return reportStatusSummary();
}

function reportFullList(list, title, filenameBase){
  if(list.length===0){ showToast("No inquiries match the current filters"); return; }
  const {doc,startY} = newReportDoc(title, `${list.length} inquiries — generated ${new Date().toLocaleDateString('en-GB')}`);
  doc.autoTable({
    head:[["ID","Received","Customer","Company","Reference / BL","Channel","Type","Priority","Assigned","Status","Resolved","Turnaround Time","SLA"]],
    body: list.map(i=>{
      const t=tatInfo(i), s=slaInfo(i);
      return [
        i.inquiryId,
        `${fmtDate(i.dateReceived)} ${i.timeReceived||''}`,
        i.customerName||'—',
        i.company||'—',
        i.referenceNumbers||'—',
        i.channel||'—',
        `${i.category||''}${i.subtype?(' / '+i.subtype):''}`,
        i.priority||'—',
        `${i.department||''}${i.assignedStaff?(' / '+i.assignedStaff):''}`,
        i.status,
        (i.resolvedDate ? `${fmtDate(i.resolvedDate)} ${i.resolvedTime||''}` : 'Not yet resolved'),
        t.label,
        s.label
      ];
    }),
    startY, theme:"grid",
    headStyles:{fillColor:[18,50,85], textColor:[232,217,189], fontStyle:"bold", fontSize:8},
    bodyStyles:{fontSize:7.5, textColor:[26,35,51]},
    alternateRowStyles:{fillColor:[238,241,245]},
    margin:{left:20,right:20},
  });
  finalizeAndSave(doc, `${filenameBase}-${dateStamp()}.pdf`);
}

function reportTurnaround(){
  const {doc,startY} = newReportDoc("Turnaround Time Report", `Receipt-to-resolution intervals — generated ${new Date().toLocaleDateString('en-GB')}`);
  const resolvedList = inquiries.filter(i=>i.resolvedDate && i.resolvedTime);
  const avgMs = resolvedList.length ? resolvedList.reduce((s,i)=>s+tatInfo(i).ms,0)/resolvedList.length : null;
  let fastest=null, slowest=null;
  resolvedList.forEach(i=>{
    const ms = tatInfo(i).ms;
    if(!fastest || ms<tatInfo(fastest).ms) fastest=i;
    if(!slowest || ms>tatInfo(slowest).ms) slowest=i;
  });
  doc.setFont("helvetica","normal");
  doc.setFontSize(9.5);
  doc.setTextColor(26,35,51);
  const summaryLines = [
    `Total inquiries: ${inquiries.length}   |   Resolved: ${resolvedList.length}   |   Still open: ${inquiries.length-resolvedList.length}`,
    `Average turnaround time: ${avgMs!=null ? formatDuration(avgMs) : 'n/a'}`,
    fastest ? `Fastest resolution: ${fastest.inquiryId} — ${fastest.customerName||''} (${formatDuration(tatInfo(fastest).ms)})` : '',
    slowest ? `Slowest resolution: ${slowest.inquiryId} — ${slowest.customerName||''} (${formatDuration(tatInfo(slowest).ms)})` : ''
  ].filter(Boolean);
  summaryLines.forEach((line,idx)=> doc.text(line, 24, startY-14+idx*14));
  const tableStart = startY-14+summaryLines.length*14+12;

  doc.autoTable({
    head:[["ID","Customer","Type","Priority","Received","Resolved","Turnaround Time","SLA Target","SLA Result"]],
    body: inquiries.map(i=>{
      const t=tatInfo(i), s=slaInfo(i);
      return [
        i.inquiryId, i.customerName||'—', i.category||'—', i.priority||'—',
        `${fmtDate(i.dateReceived)} ${i.timeReceived||''}`,
        (i.resolvedDate ? `${fmtDate(i.resolvedDate)} ${i.resolvedTime||''}` : 'Ongoing'),
        t.label, i.slaTarget||'—', s.label
      ];
    }),
    startY: tableStart, theme:"grid",
    headStyles:{fillColor:[18,50,85], textColor:[232,217,189], fontStyle:"bold", fontSize:8.5},
    bodyStyles:{fontSize:8, textColor:[26,35,51]},
    alternateRowStyles:{fillColor:[238,241,245]},
    margin:{left:24,right:24},
  });
  finalizeAndSave(doc, `turnaround-time-report-${dateStamp()}.pdf`);
}

function reportSLA(){
  const {doc,startY} = newReportDoc("SLA Performance Report", `Service-level compliance — generated ${new Date().toLocaleDateString('en-GB')}`);
  doc.autoTable({
    head:[["ID","Priority","SLA Target","Status","Turnaround Time","SLA Result"]],
    body: inquiries.map(i=>{
      const t=tatInfo(i), s=slaInfo(i);
      return [i.inquiryId, i.priority||'—', i.slaTarget||'—', i.status, t.label, s.label];
    }),
    startY, theme:"grid",
    headStyles:{fillColor:[18,50,85], textColor:[232,217,189], fontStyle:"bold", fontSize:9},
    bodyStyles:{fontSize:8.5, textColor:[26,35,51]},
    alternateRowStyles:{fillColor:[238,241,245]},
    didParseCell: function(dataArg){
      if(dataArg.section==='body' && dataArg.column.index===5){
        const val = (dataArg.cell.raw||"").toLowerCase();
        if(val.includes('overdue') || val.includes('late')) { dataArg.cell.styles.textColor=[192,57,43]; dataArg.cell.styles.fontStyle='bold'; }
        else if(val.includes('due')) { dataArg.cell.styles.textColor=[169,114,11]; }
        else if(val.includes('on time')) { dataArg.cell.styles.textColor=[46,125,91]; }
      }
    },
    margin:{left:24,right:24},
  });
  finalizeAndSave(doc, `sla-performance-report-${dateStamp()}.pdf`);
}

function reportOverdue(){
  const overdueList = inquiries.filter(i=>slaInfo(i).cls==="Overdue");
  if(overdueList.length===0){ showToast("No overdue inquiries 🎉"); reportsMenuOpen=false; renderNav(); return; }
  const {doc,startY} = newReportDoc("Overdue Inquiries Report", `${overdueList.length} inquiries past SLA target — generated ${new Date().toLocaleDateString('en-GB')}`);
  doc.autoTable({
    head:[["ID","Customer","Company","Reference / BL","Priority","Department","Status","Received","SLA Target","Turnaround Time"]],
    body: overdueList.map(i=>{
      const t=tatInfo(i);
      return [i.inquiryId, i.customerName||'—', i.company||'—', i.referenceNumbers||'—', i.priority||'—', i.department||'—', i.status, `${fmtDate(i.dateReceived)} ${i.timeReceived||''}`, i.slaTarget||'—', t.label];
    }),
    startY, theme:"grid",
    headStyles:{fillColor:[192,57,43], textColor:[255,255,255], fontStyle:"bold", fontSize:8.5},
    bodyStyles:{fontSize:8, textColor:[26,35,51]},
    alternateRowStyles:{fillColor:[252,232,230]},
    margin:{left:24,right:24},
  });
  finalizeAndSave(doc, `overdue-inquiries-${dateStamp()}.pdf`);
}

function reportStatusSummary(){
  const {doc,startY} = newReportDoc("Status Summary Report", `Inquiry breakdown — generated ${new Date().toLocaleDateString('en-GB')}`);
  let y = addSection(doc,"By Status", ["Status","Count","% of Total"], countBy(inquiries,'status').map(([n,c])=>[n,c, Math.round(c/inquiries.length*100)+'%']), startY);
  y = addSection(doc,"By Department", ["Department","Count"], countBy(inquiries,'department').map(([n,c])=>[n,c]), y);
  y = addSection(doc,"By Channel", ["Channel","Count"], countBy(inquiries,'channel').map(([n,c])=>[n,c]), y);
  addSection(doc,"By Inquiry Type", ["Type","Count"], countBy(inquiries,'category').map(([n,c])=>[n,c]), y);
  finalizeAndSave(doc, `status-summary-report-${dateStamp()}.pdf`);
}

/* ============================================================
   INIT
============================================================ */
loadData();
</script>
